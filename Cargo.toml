[workspace]
resolver = "2"
members = [
    "crates/lamina",
    "crates/lamina-cli",
    "crates/lamina-llb",
    "crates/lamina-client",
]
default-members = ["crates/lamina-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VitorRamos/lamina"
rust-version = "1.74"

[workspace.dependencies]
lamina = { path = "crates/lamina", version = "0.3.0" }
lamina-llb = { path = "crates/lamina-llb", version = "0.3.0" }
lamina-client = { path = "crates/lamina-client", version = "0.3.0" }
clap = { version = "4.5", features = ["derive"] }
