# PR / main gate: fmt, clippy, unit tests, example typecheck.
# No Docker/BuildKit required. No crates.io publish.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: fmt · clippy · test · examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + MSRV note)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
        # Workspace MSRV is 1.74 (Cargo.toml rust-version); CI uses current stable.

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: lamina check examples
        run: |
          set -euo pipefail
          cargo build -q -p lamina-cli
          for d in examples/*/; do
            if [ -f "${d}Lamina.toml" ]; then
              echo "== check $d =="
              ./target/debug/lamina check "$d"
            fi
          done

  # Dependency policy: licenses, RustSec advisories, unknown sources.
  # Uses deny.toml at repo root. Advisories DB is fetched by the action each run
  # (no vendored DB). Locally: `cargo deny fetch && cargo deny check`.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
